<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toko Online Modern</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="tugas.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm"
    >
      <div class="container">
        <a class="navbar-brand" href="#">TECH-STORE</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" href="#">Beranda</a>
            </li>
            <li class="nav-item"><a class="nav-link" href="#">Produk</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Tentang</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Header / Hero Section -->
    <header class="bg-white py-5 border-bottom mb-5">
      <div class="container text-center">
        <h1 class="display-4 fw-bold">Koleksi Gadget Terbaru</h1>
        <p class="lead text-muted">
          Temukan perangkat impian Anda dengan harga terbaik
        </p>
      </div>
    </header>

    <!-- Main Content -->
    <div class="container pb-5">
      <div class="row g-4">
        <!-- Filter Sidebar -->
        <div class="col-lg-3">
          <div class="card p-4 shadow-sm">
            <h5 class="mb-4 fw-bold">Filter & Cari</h5>

            <!-- Search -->
            <div class="mb-4">
              <label class="form-label small fw-bold text-uppercase"
                >Cari Produk</label
              >
              <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="Nama produk..."
              />
            </div>

            <!-- Category Filter -->
            <div class="mb-4">
              <label class="form-label small fw-bold text-uppercase"
                >Kategori</label
              >
              <select id="categoryFilter" class="form-select">
                <option value="Semua">Semua Kategori</option>
                <option value="Laptop">Laptop</option>
                <option value="Smartphone">Smartphone</option>
                <option value="Aksesoris">Aksesoris</option>
              </select>
            </div>

            <!-- Price Sort -->
            <div class="mb-4">
              <label class="form-label small fw-bold text-uppercase"
                >Urutkan Harga</label
              >
              <select id="priceSort" class="form-select">
                <option value="default">Terbaru</option>
                <option value="low">Termurah ke Termahal</option>
                <option value="high">Termahal ke Termurah</option>
              </select>
            </div>

            <button
              id="resetBtn"
              class="btn btn-outline-secondary w-full w-100"
            >
              Reset Filter
            </button>
          </div>
        </div>

        <!-- Product Grid -->
        <div class="col-lg-9">
          <div
            id="productGrid"
            class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4"
          >
            <!-- Produk akan dirender di sini via JavaScript -->
          </div>

          <!-- Empty State -->
          <div id="empty-state" class="text-center py-5">
            <img
              src="https://via.placeholder.com/150?text=Empty"
              alt="Tidak ada produk"
              class="mb-3 opacity-50"
            />
            <h4 class="text-muted">Produk tidak ditemukan</h4>
            <p>Coba gunakan kata kunci atau filter lain.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-auto">
      <div class="container text-center">
        <p class="mb-0 small">
          &copy; 2024 Tech-Store. Dibuat dengan Bootstrap 5.
        </p>
      </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="tugas.js"></script>
  </body>
</html>
